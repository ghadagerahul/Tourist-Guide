name: Maven CI/CD Pipeline

on:
  push:
    branches:
      - tourist_app_development
  pull_request:
    branches:
      - tourist_app_development
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Change to the correct directory
      run: cd Tourist-Guide

    - name: Build with Maven
      run: |
        cd Tourist-Guide
        mvn clean install

    - name: Package WAR file
      run: |
        cd Tourist-Guide
        mvn package

    - name: Upload WAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: tourist-guide-war
        path: Tourist-Guide/target/*.war
